# Обратный прокси для signal.vis.ru.
#
#   sudo cp deploy/nginx-signal.vis.ru.conf /etc/nginx/sites-available/signal.vis.ru
#   sudo ln -s /etc/nginx/sites-available/signal.vis.ru /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Приложение слушает только 127.0.0.1:5175 — наружу оно смотрит исключительно
# отсюда, поэтому TLS обрывается на nginx, а порт 5175 закрыт из интернета.

upstream signal_monitor {
    server 127.0.0.1:5175;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name signal.vis.ru;

    # Единственная задача открытого HTTP — увести на HTTPS.
    return 301 https://$host$request_uri;
}

server {
    # http2 задан прямо в listen: отдельная директива `http2 on` появилась
    # только в nginx 1.25.1, а этот вид понимают и старые, и новые сборки.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name signal.vis.ru;

    # Wildcard-сертификат *.vis.ru (GlobalSign GCC R3 DV TLS CA 2020, до 03.12.2026).
    # В fullchain лежит сертификат ВМЕСТЕ с промежуточными и строго в этом
    # порядке: сначала лист, потом цепочка. Без промежуточных Android и старые
    # клиенты не доверяют сайту, а десктопный Chrome — доверяет, и проблему
    # легко не заметить.
    ssl_certificate     /etc/ssl/vis.ru/fullchain.pem;
    ssl_certificate_key /etc/ssl/vis.ru/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Версию nginx наружу не сообщаем.
    server_tokens off;

    # Десять вложений по 15 МБ за один запрос плюс служебные поля.
    client_max_body_size 160m;
    client_body_timeout 120s;

    access_log /var/log/nginx/signal.vis.ru.access.log;
    error_log  /var/log/nginx/signal.vis.ru.error.log;

    # Заголовки безопасности (CSP, HSTS, X-Frame-Options) ставит само
    # приложение — здесь их дублировать не нужно, иначе они придут дважды.

    # Поток изменений держится открытым часами и отдается по байту:
    # буферизацию и таймаут ответа для него надо снимать отдельно.
    location /api/events {
        proxy_pass http://signal_monitor;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        chunked_transfer_encoding off;
    }

    # Руководства пользователя: статические страницы, отдаются nginx напрямую.
    # До приложения эти запросы не доходят — оно о них не знает и сломать их
    # не может, как и они его. Файлы лежат вне репозитория, git pull их не трогает.
    #
    # root, а не alias: с alias директива try_files подставляет исходный URI,
    # а не путь внутри каталога, и правило молча перестает работать.
    location /guides/ {
        root /var/www;
        # /guides/admin -> /var/www/guides/admin.html
        try_files $uri $uri.html $uri/index.html =404;

        # Защитные заголовки ставит приложение, но сюда запрос не попадает —
        # значит, для этих страниц их нужно задать заново. Страницы полностью
        # автономны (шрифты системные, картинки вшиты как data:), поэтому
        # политика такая же строгая, как у самого приложения.
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy same-origin always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    location / {
        proxy_pass http://signal_monitor;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Экспорт в Excel на большой базе собирается не мгновенно.
        proxy_read_timeout 120s;
    }
}
