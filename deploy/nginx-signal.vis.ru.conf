# Обратный прокси для signal.vis.ru.
#
#   sudo cp deploy/nginx-signal.vis.ru.conf /etc/nginx/sites-available/signal.vis.ru
#   sudo ln -s /etc/nginx/sites-available/signal.vis.ru /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Приложение слушает только 127.0.0.1:5175 — наружу оно смотрит исключительно
# отсюда, поэтому TLS обрывается на nginx, а порт 5175 закрыт из интернета.

upstream signal_monitor {
    server 127.0.0.1:5175;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name signal.vis.ru;

    # Единственная задача открытого HTTP — увести на HTTPS.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name signal.vis.ru;

    # Wildcard-сертификат *.vis.ru. В fullchain должен лежать сертификат
    # ВМЕСТЕ с промежуточными — без них Android и старые клиенты ругаются.
    ssl_certificate     /etc/ssl/vis.ru/fullchain.pem;
    ssl_certificate_key /etc/ssl/vis.ru/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Версию nginx наружу не сообщаем.
    server_tokens off;

    # Десять вложений по 15 МБ за один запрос плюс служебные поля.
    client_max_body_size 160m;
    client_body_timeout 120s;

    access_log /var/log/nginx/signal.vis.ru.access.log;
    error_log  /var/log/nginx/signal.vis.ru.error.log;

    # Заголовки безопасности (CSP, HSTS, X-Frame-Options) ставит само
    # приложение — здесь их дублировать не нужно, иначе они придут дважды.

    # Поток изменений держится открытым часами и отдается по байту:
    # буферизацию и таймаут ответа для него надо снимать отдельно.
    location /api/events {
        proxy_pass http://signal_monitor;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        chunked_transfer_encoding off;
    }

    location / {
        proxy_pass http://signal_monitor;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Экспорт в Excel на большой базе собирается не мгновенно.
        proxy_read_timeout 120s;
    }
}
